name: k3s Cluster (rotating)

# Every 3h a new cluster comes up; each lives 6h. That means two are alive at
# all times — one mature primary, one warm standby — so a rotation is a planned
# handoff instead of an outage. Do NOT add a `concurrency:` block: cancelling the
# in-progress run is exactly the overlap this design depends on.
#
# No `schedule:` here on purpose. Cron only ever fires from the DEFAULT branch,
# and this file lives on a feature branch — a schedule here would silently never
# run. Rotation is driven by keep-alive.yml on main, which dispatches this
# workflow with ref=chore/infra-7f3a2c so the run uses THIS copy of the file.
on:
  workflow_dispatch:
    inputs:
      handoff_mode:
        description: 'How the site survives a rotation (see scripts/handoff.sh)'
        type: choice
        default: cutover
        options: [cutover, replica, parallel]
      spawn_after_seconds:
        description: 'Seconds before this box dispatches its successor (10800 = 3h; lower it to test the chain)'
        default: '10800'
      handoff_lead_seconds:
        description: 'Seconds before the kill to start handing over'
        default: '900'
  # spawn-successor.sh dispatches with only `ref`, so every input above falls back
  # to its default in the chained runs. That is intended: a test run's shortened
  # timings must not propagate to the whole rotation.

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3.5.2
      - name: Preparing Linux Environment
        run: sudo apt-get update
      - name: Setting Up the Ubuntu Environment
        run: bash linux-server.sh
        env:
          LINUX_USER_PASSWORD: ${{ secrets.LINUX_USER_PASSWORD }}
          LINUX_MACHINE_NAME: ${{ secrets.LINUX_MACHINE_NAME }}
          LINUX_USERNAME: ${{ secrets.LINUX_USERNAME }}
          CHROME_HEADLESS_CODE: ${{ secrets.CHROME_HEADLESS_CODE }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          # VPN mesh — tailscale | netbird. Only the selected one's keys are read.
          VPN_PROVIDER: ${{ vars.VPN_PROVIDER }}
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
          NETBIRD_MANAGEMENT_URL: ${{ secrets.NETBIRD_MANAGEMENT_URL }}
          NETBIRD_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}
          # Rewrites the zone's A records to whichever box is primary. Peer
          # FQDNs carry the run number, so they can't be the stable name.
          NETBIRD_TOKEN: ${{ secrets.NETBIRD_TOKEN }}
          NETBIRD_DNS_ZONE: ${{ vars.NETBIRD_DNS_ZONE }}
          GDRIVE_FOLDER: ${{ secrets.GDRIVE_FOLDER }}
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}   # same PAT the runner already uses
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          # R2 holds the Postgres base backups and the continuous WAL archive.
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          REPO: ${{ secrets.REPO }}
          # Which repo/branch this box dispatches its successor on. GITHUB_* are
          # already in every step's environment, but they are passed explicitly
          # here so the chain is greppable: whatever ref started this run is the
          # ref the next run gets, so the rotation stays on one branch.
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SPAWN_REF: ${{ github.ref_name }}
          SPAWN_REPO: ${{ github.repository }}
          SPAWN_WORKFLOW: server.yml
          # Rotation behaviour. HANDOFF_MODE: cutover (silent successor, rebuilt
          # from the final backup) | replica (streaming standby, promoted) |
          # parallel (both serve — TWO DIVERGENT DATABASES, read-only sites only).
          HANDOFF_MODE: ${{ inputs.handoff_mode }}
          SPAWN_AFTER_SECONDS: ${{ inputs.spawn_after_seconds }}
          HANDOFF_LEAD_SECONDS: ${{ inputs.handoff_lead_seconds }}
          # Must match the `sleep 6h` below — it is how the box knows its deadline.
          JOB_TTL_SECONDS: '21600'
          # Bounded so an unrestorable archive fails loudly in 30m instead of
          # hanging until GitHub kills the VM.
          CNPG_WAIT_TIMEOUT: 30m
          # How many old archive prefixes to keep in R2 (r2_prune).
          R2_KEEP: '3'
          # NO K3S_URL/K3S_TOKEN here: get.k3s.io reads them straight from the
          # environment and silently installs an *agent* that joins that cluster,
          # even though linux-solo.sh never references them.
      - name: Keep Running Ubuntu System and keepAlive
        run: sleep 6h
