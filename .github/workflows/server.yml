name: k3s Cluster (rotating)

# Every 3h a new cluster comes up; each lives 6h. That means two are alive at
# all times — one mature primary, one warm standby — so a rotation is a planned
# handoff instead of an outage. Do NOT add a `concurrency:` block: cancelling the
# in-progress run is exactly the overlap this design depends on.
#
# No `schedule:` here on purpose. Cron only ever fires from the DEFAULT branch,
# and this file lives on a feature branch — a schedule here would silently never
# run. Instead each run dispatches its OWN successor partway through its life
# (the "Dispatch the successor" step below), so the chain is self-sustaining and
# every dispatch is visible in the job log that made it.
on:
  workflow_dispatch:
    inputs:
      handoff_mode:
        description: 'How the site survives a rotation (see scripts/handoff.sh)'
        type: choice
        default: cutover
        options: [cutover, replica, parallel]
      spawn_after_seconds:
        description: 'Seconds before this box dispatches its successor (10800 = 3h; lower it to test the chain)'
        default: '10800'
      handoff_lead_seconds:
        description: 'Seconds before the kill to start handing over'
        default: '900'
  # spawn-successor.sh dispatches with only `ref`, so every input above falls back
  # to its default in the chained runs. That is intended: a test run's shortened
  # timings must not propagate to the whole rotation.

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3.5.2
      - name: Preparing Linux Environment
        run: sudo apt-get update
      - name: Setting Up the Ubuntu Environment
        run: bash linux-server.sh
        env:
          LINUX_USER_PASSWORD: ${{ secrets.LINUX_USER_PASSWORD }}
          LINUX_MACHINE_NAME: ${{ secrets.LINUX_MACHINE_NAME }}
          LINUX_USERNAME: ${{ secrets.LINUX_USERNAME }}
          CHROME_HEADLESS_CODE: ${{ secrets.CHROME_HEADLESS_CODE }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          # VPN mesh — tailscale | netbird. Only the selected one's keys are read.
          VPN_PROVIDER: ${{ vars.VPN_PROVIDER }}
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
          NETBIRD_MANAGEMENT_URL: ${{ secrets.NETBIRD_MANAGEMENT_URL }}
          NETBIRD_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}
          # Rewrites the zone's A records to whichever box is primary. Peer
          # FQDNs carry the run number, so they can't be the stable name.
          NETBIRD_TOKEN: ${{ secrets.NETBIRD_TOKEN }}
          NETBIRD_DNS_ZONE: ${{ vars.NETBIRD_DNS_ZONE }}
          GDRIVE_FOLDER: ${{ secrets.GDRIVE_FOLDER }}
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}   # same PAT the runner already uses
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          # R2 holds the Postgres base backups and the continuous WAL archive.
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          REPO: ${{ secrets.REPO }}
          # Which repo/branch this box dispatches its successor on. GITHUB_* are
          # already in every step's environment, but they are passed explicitly
          # here so the chain is greppable: whatever ref started this run is the
          # ref the next run gets, so the rotation stays on one branch.
          # Dispatching the successor needs a PAT with `workflow` scope: a
          # workflow_dispatch sent with the built-in GITHUB_TOKEN is silently
          # ignored and never starts a run (GitHub's recursion guard).
          # Kept separate from GH_TOKEN, which ghcr uses — different job, and the
          # rotation must not break when the registry credential is rotated.
          SPAWN_TOKEN: ${{ secrets.SPAWN_TOKEN }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SPAWN_REF: ${{ github.ref_name }}
          SPAWN_REPO: ${{ github.repository }}
          SPAWN_WORKFLOW: server.yml
          # Rotation behaviour. HANDOFF_MODE: cutover (silent successor, rebuilt
          # from the final backup) | replica (streaming standby, promoted) |
          # parallel (both serve — TWO DIVERGENT DATABASES, read-only sites only).
          HANDOFF_MODE: ${{ inputs.handoff_mode }}
          SPAWN_AFTER_SECONDS: ${{ inputs.spawn_after_seconds }}
          HANDOFF_LEAD_SECONDS: ${{ inputs.handoff_lead_seconds }}
          # Must match the `sleep 6h` below — it is how the box knows its deadline.
          JOB_TTL_SECONDS: '21600'
          # Bounded so an unrestorable archive fails loudly in 30m instead of
          # hanging until GitHub kills the VM.
          CNPG_WAIT_TIMEOUT: 30m
          # How many old archive prefixes to keep in R2 (r2_prune).
          R2_KEEP: '3'
          # The workflow dispatches the successor itself (step below), so the
          # box must not also arm a spawn timer — two dispatchers, two successors.
          SPAWN_FROM_WORKFLOW: '1'
          # NO K3S_URL/K3S_TOKEN here: get.k3s.io reads them straight from the
          # environment and silently installs an *agent* that joins that cluster,
          # even though linux-solo.sh never references them.
      # The 6h keepalive, split in two so the successor is dispatched from the
      # workflow itself rather than from a systemd timer on the VM. The timer
      # version failed silently twice: its log lives in /var/log on a box that is
      # destroyed an hour later, so a bad token looked exactly like "nothing
      # happened". Here the dispatch is a step — its output is in this job's log.
      - name: Keep alive until the successor is due
        run: sleep ${{ inputs.spawn_after_seconds || 10800 }}

      - name: Dispatch the successor
        # Never fail the job: this cluster is serving traffic, and killing it at
        # T+3h because a dispatch failed would turn a rotation problem into an
        # outage. A failure here is loud in the log and the cluster keeps running.
        continue-on-error: true
        env:
          # Needs `workflow` scope. GITHUB_TOKEN cannot do this — GitHub silently
          # drops a workflow_dispatch made with it — and a `repo`-only PAT fails
          # with "Must have admin rights to Repository (403)".
          GH_TOKEN: ${{ secrets.SPAWN_TOKEN }}
        run: |
          set -uo pipefail
          WF="/repos/${{ github.repository }}/actions/workflows/server.yml"

          # Don't fan out. Each cluster spawns exactly one successor, so with a
          # third started by hand the chain would otherwise grow every rotation.
          active=0
          for s in queued in_progress; do
            n=$(gh api "$WF/runs?status=$s&per_page=100" --jq '.total_count // 0' 2>/dev/null || echo 0)
            active=$((active + n))
          done
          echo "Active runs: $active"
          if [ "$active" -ge 2 ]; then
            echo "Already $active clusters alive — not spawning."
            exit 0
          fi

          for attempt in 1 2 3 4 5; do
            if gh api --method POST "$WF/dispatches" -f ref="${{ github.ref_name }}"; then
              echo "Dispatched successor on ${{ github.ref_name }}"
              exit 0
            fi
            echo "Attempt $attempt failed — retrying in $((attempt * 20))s"
            sleep $((attempt * 20))
          done
          echo "ALERT: could not dispatch a successor. The rotation chain is broken."
          echo "Hint: SPAWN_TOKEN must be a PAT with 'workflow' scope."
          exit 1

      # The rest of the 6h. GitHub kills the VM at the end of it regardless; the
      # on-box handoff.timer fires 15m before that to hand traffic over.
      - name: Keep Running Ubuntu System and keepAlive
        run: sleep 3h
